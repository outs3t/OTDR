<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>OTDR V9 - Legacy 1.1 Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #e9ecef; padding: 20px; }
        .box { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #c0392b; border-bottom: 2px solid #eee; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; box-sizing: border-box; }
        .btn-gen { background: #c0392b; color: white; font-weight: bold; border: none; cursor: pointer; font-size: 1.1em; }
        .btn-add { background: #2980b9; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2>Simulatore OTDR V9 (Legacy Mode)</h2>
    <div class="grid">
        <div>
            <label>Lunghezza (metri)</label>
            <input type="number" id="len" value="2000" onchange="update()">
            <label>Perdita (dB/km)</label>
            <input type="number" id="att" value="0.25" step="0.01" onchange="update()">
            
            <hr>
            <label>Aggiungi Evento</label>
            <select id="type">
                <option value="point">📍 Picco</option>
                <option value="interval">↔️ Intervallo</option>
            </select>
            <input type="number" id="dist" placeholder="Distanza (m)">
            <input type="number" id="end" placeholder="Fine (m) per intervalli" style="display:none">
            <input type="number" id="loss" placeholder="dB">
            <button class="btn-add" onclick="addE()">Aggiungi</button>
            <div id="list"></div>
            
            <hr>
            <button class="btn-gen" onclick="generateLegacy()">SCARICA SOR LEGACY</button>
        </div>
        <div>
            <canvas id="chart"></canvas>
        </div>
    </div>
</div>

<script>
    let events = [];
    const ctx = document.getElementById('chart').getContext('2d');
    let chart = new Chart(ctx, {
        type: 'line',
        data: { datasets: [{ borderColor: 'red', borderWidth: 1, pointRadius: 0, data: [] }] },
        options: { animation: false, scales: { x: {type:'linear'}, y: {reverse:true} }, plugins:{legend:{display:false}} }
    });

    document.getElementById('type').addEventListener('change', function() {
        document.getElementById('end').style.display = this.value==='interval'?'block':'none';
    });

    function addE() {
        let t = document.getElementById('type').value;
        let l = parseFloat(document.getElementById('loss').value);
        let d = parseFloat(document.getElementById('dist').value);
        let e = parseFloat(document.getElementById('end').value);
        events.push({t, d, e, l, id:Date.now()});
        update();
    }

    function getData() {
        let L = parseFloat(document.getElementById('len').value);
        let A = parseFloat(document.getElementById('att').value)/1000;
        let data = [];
        let db = 0;
        // Simuliamo 1000 punti fissi per compatibilità legacy
        let step = L / 1000; 
        
        events.sort((a,b)=>a.d-b.d);

        for(let i=0; i<=1000; i++) {
            let m = i * step;
            db += A * step;
            for(let ev of events) {
                if(ev.t==='point' && m>=ev.d && (m-step)<ev.d) db+=ev.l;
                else if(ev.t==='interval' && m>=ev.d && m<=ev.e) db+=(ev.l/(ev.e-ev.d))*step;
            }
            data.push({x: m, y: db + (Math.random()*0.02)});
        }
        return data;
    }

    function update() {
        chart.data.datasets[0].data = getData();
        chart.update();
    }
    update();

    // --- GENERATORE LEGACY 1.1 (Semplificato) ---
    function generateLegacy() {
        let data = getData();
        let numPts = data.length;
        
        // Buffer
        let buffer = new ArrayBuffer(50000);
        let v = new DataView(buffer);
        let p = 0;

        function wS(s) { for(let i=0;i<s.length;i++) v.setUint8(p++, s.charCodeAt(i)); v.setUint8(p++,0); }
        function w16(n) { v.setInt16(p, n, true); p+=2; }
        function w32(n) { v.setInt32(p, n, true); p+=4; }
        function wU16(n) { v.setUint16(p, n, true); p+=2; }
        function wU32(n) { v.setUint32(p, n, true); p+=4; }

        // MAP (Version 1.1 = 101)
        let mapStart = p;
        wS("Map");
        wU16(101); // Versione 1.1
        let mapSizePos = p; wU32(0);
        wU16(2); // Solo 2 blocchi essenziali: FxdParams, DataPts (Cksum e nascosto)

        // Definiamo i blocchi
        wS("FxdParams"); wU16(101); let fxdSize = p; wU32(0); let fxdOff = p; wU32(0);
        wS("DataPts"); wU16(101); let datSize = p; wU32(0); let datOff = p; wU32(0);
        
        // Chiudiamo MAP
        let mapEnd = p;
        v.setUint32(mapSizePos, mapEnd-mapStart, true);

        // FXDPARAMS
        let fxdStart = p;
        v.setUint32(fxdOff, p, true); // Update offset
        wS("FxdParams");
        wU32(Date.now()/1000);
        wS("mt"); // Unit
        wS("1650"); // Lambda
        w32(0); // Offset
        w32(numPts); // Num Pts
        wU16(numPts);
        wU32(parseInt((parseFloat(document.getElementById('len').value)/numPts)*10000)); // Spacing
        w32(numPts);
        w32(14650); // IOR
        wU16(0); w32(0);
        v.setUint32(fxdSize, p-fxdStart, true);

        // DATAPTS
        let datStart = p;
        v.setUint32(datOff, p, true);
        wS("DataPts");
        wU32(numPts); wU16(1); w32(numPts); wU16(1000); // Scale factor
        
        // Scriviamo i punti
        for(let i=0; i<numPts; i++) {
            let val = (50 - data[i].y) * 1000; // Offset 50dB
            if(val<0) val=0;
            wU16(parseInt(val));
        }
        v.setUint32(datSize, p-datStart, true);

        // CKSUM (Legacy usa somma semplice a volte, ma proviamo CRC standard)
        wS("Cksum");
        let ckPos = p; wU16(0);
        
        // Calcolo CRC brutale
        let crc = 0;
        let bytes = new Uint8Array(buffer, 0, p);
        for (let i=0; i<bytes.length; i++) {
            let x = ((crc>>8)^bytes[i]) & 0xFF;
            x ^= x>>4;
            crc = ((crc<<8)^(x<<12)^(x<<5)^x) & 0xFFFF;
        }
        v.setUint16(ckPos, crc, true);
        p+=2; // Fine file

        // Download
        let b = new Blob([new Uint8Array(buffer, 0, p)], {type:'application/octet-stream'});
        let a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = "LegacyTrace_V1.sor";
        a.click();
    }
</script>
</body>
</html>
