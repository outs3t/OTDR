<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore OTDR V4 - Raw Data</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .controls { background: #eef2f7; padding: 15px; border-radius: 8px; }
        .btn { padding: 12px; border: none; border-radius: 5px; cursor: pointer; width: 100%; margin-bottom: 10px; font-weight: bold; color: white; }
        .btn-add { background: #3498db; }
        .btn-raw { background: #8e44ad; font-size: 1.1em; } /* Viola per distinguere */
        .btn-zoom { background: #95a5a6; width: 32%; display: inline-block; }
        input, select { width: 100%; padding: 8px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        label { font-weight: bold; font-size: 0.9em; }
        #eventList { height: 150px; overflow-y: auto; background: #fff; border: 1px solid #ddd; padding: 5px; margin-bottom: 10px; }
        .event-item { font-size: 0.85em; border-bottom: 1px solid #eee; padding: 4px; display: flex; justify-content: space-between; }
        .note { font-size: 0.8em; color: #c0392b; background: #fadbd8; padding: 10px; border-radius: 4px; margin-top: 10px; border: 1px solid #e6b0aa; }
    </style>
</head>
<body>

<div class="container">
    <h1>Generatore OTDR "Clean Data"</h1>
    
    <div class="grid">
        <div class="controls">
            <label>Lunghezza (metri)</label>
            <input type="number" id="totalLength" value="2000" onchange="updateGraph()">
            
            <label>Attenuazione (dB/km)</label>
            <input type="number" id="fiberLoss" value="0.25" step="0.01" onchange="updateGraph()">

            <hr>
            <label>Tipo Evento</label>
            <select id="eventType" onchange="toggleEventInputs()">
                <option value="point">Evento Puntuale (es. Giunto)</option>
                <option value="interval">Intervallo (es. Curva/Stress)</option>
            </select>

            <div id="pointInput">
                <label>Distanza (m)</label>
                <input type="number" id="eventDist" placeholder="es. 1000">
            </div>
            <div id="intervalInput" style="display:none;">
                <label>Da (m)</label>
                <input type="number" id="eventStart" placeholder="1000">
                <label>A (m)</label>
                <input type="number" id="eventEnd" placeholder="1020">
            </div>

            <label>Perdita (dB)</label>
            <input type="number" id="eventLoss" placeholder="0.5" step="0.05">

            <button class="btn btn-add" onclick="addEvent()">Aggiungi Evento</button>
            <div id="eventList"></div>

            <hr>
            <button class="btn btn-raw" onclick="generateRawTXT()">💾 SCARICA RAW DATA (.TXT)</button>
            
            <div class="note">
                <strong>IMPORTANTE PER FIBER TRACE:</strong><br>
                1. Non usare "Apri".<br>
                2. Vai su <em>File > Import (o Import ASCII)</em>.<br>
                3. Se chiede i delimitatori: Scegli <strong>TAB</strong>.<br>
                4. Questo file non ha intestazioni, sono solo numeri puri per evitare errori Heading.
            </div>
        </div>

        <div>
            <canvas id="otdrChart"></canvas>
            <div style="text-align:center; margin-top:10px;">
                <button class="btn btn-zoom" onclick="zoomChart(0.5)">🔍 Zoom +</button>
                <button class="btn btn-zoom" onclick="resetZoom()">🔄 Reset</button>
                <button class="btn btn-zoom" onclick="zoomChart(1.5)">🔍 Zoom -</button>
                <br>
                <input type="range" id="panRange" min="0" max="100" value="0" style="width:80%; margin-top:10px;" oninput="panChart(this.value)" disabled>
            </div>
        </div>
    </div>
</div>

<script>
    let chart;
    let events = [];

    window.onload = function() {
        const ctx = document.getElementById('otdrChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Traccia dB',
                    data: [],
                    borderColor: '#2ecc71',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    fill: false,
                    tension: 0.1
                }]
            },
            options: {
                animation: false,
                scales: {
                    x: { type: 'linear', position: 'bottom', title: {display:true, text:'Metri'} },
                    y: { reverse: true, title: {display:true, text:'dB'} }
                }
            }
        });
        updateGraph();
    };

    function toggleEventInputs() {
        const type = document.getElementById('eventType').value;
        document.getElementById('pointInput').style.display = type === 'point' ? 'block' : 'none';
        document.getElementById('intervalInput').style.display = type === 'interval' ? 'block' : 'none';
    }

    function addEvent() {
        const type = document.getElementById('eventType').value;
        const loss = parseFloat(document.getElementById('eventLoss').value);
        if(isNaN(loss)) return;

        let newEvt = { loss: loss, id: Date.now(), type: type };
        
        if (type === 'point') {
            newEvt.dist = parseFloat(document.getElementById('eventDist').value);
        } else {
            newEvt.start = parseFloat(document.getElementById('eventStart').value);
            newEvt.end = parseFloat(document.getElementById('eventEnd').value);
        }
        events.push(newEvt);
        renderEvents();
        updateGraph();
    }

    function renderEvents() {
        const list = document.getElementById('eventList');
        list.innerHTML = "";
        events.forEach(e => {
            let txt = e.type==='point' ? `@${e.dist}m -${e.loss}dB` : `Int ${e.start}-${e.end}m -${e.loss}dB`;
            list.innerHTML += `<div class="event-item"><span>${txt}</span><span style="color:red;cursor:pointer" onclick="delEvent(${e.id})">X</span></div>`;
        });
    }
    
    function delEvent(id) {
        events = events.filter(e => e.id !== id);
        renderEvents();
        updateGraph();
    }

    function calculateData() {
        const len = parseFloat(document.getElementById('totalLength').value);
        const att = parseFloat(document.getElementById('fiberLoss').value) / 1000; // dB per metro
        const step = 1; // 1 punto per metro per massima compatibilità
        
        let data = [];
        let currLoss = 0;
        
        events.sort((a,b) => (a.dist||a.start) - (b.dist||b.start));

        for(let m=0; m<=len; m+=step) {
            currLoss += att * step;
            
            for(let e of events) {
                if(e.type === 'point' && m >= e.dist && (m-step) < e.dist) {
                    currLoss += e.loss;
                } else if (e.type === 'interval' && m >= e.start && m <= e.end) {
                    currLoss += (e.loss / (e.end - e.start)) * step;
                }
            }
            // Rumore minimo per realismo (Fiber Trace lo apprezza)
            let noise = (Math.random() - 0.5) * 0.01;
            data.push({ x: m, y: currLoss + noise });
        }
        return data;
    }

    function updateGraph() {
        const d = calculateData();
        chart.data.datasets[0].data = d;
        chart.options.scales.x.max = parseFloat(document.getElementById('totalLength').value);
        document.getElementById('panRange').disabled = false;
        chart.update();
    }

    // --- ZOOM ---
    function zoomChart(fact) {
        const s = chart.options.scales.x;
        const range = s.max - s.min;
        const center = s.min + range/2;
        const newRange = range * fact;
        const maxL = parseFloat(document.getElementById('totalLength').value);
        
        s.min = Math.max(0, center - newRange/2);
        s.max = Math.min(maxL, center + newRange/2);
        chart.update();
    }
    function resetZoom() {
        chart.options.scales.x.min = 0;
        chart.options.scales.x.max = parseFloat(document.getElementById('totalLength').value);
        chart.update();
    }
    function panChart(val) {
        const s = chart.options.scales.x;
        const rng = s.max - s.min;
        const maxL = parseFloat(document.getElementById('totalLength').value);
        const newMin = (val/100) * (maxL - rng);
        s.min = newMin;
        s.max = newMin + rng;
        chart.update();
    }

    // --- ESPORTAZIONE RAW PER FIBER TRACE ---
    function generateRawTXT() {
        const d = calculateData();
        // NESSUN HEADER: Solo numeri per evitare "Heading Error"
        // Formato: Distanza(km) [TAB] Potenza(dB)
        let txt = ""; 
        
        d.forEach(p => {
            // Fiber Trace preferisce i KM e usa il punto come decimale
            let km = (p.x / 1000).toFixed(6); 
            let db = p.y.toFixed(5);
            txt += `${km}\t${db}\r\n`;
        });

        const blob = new Blob([txt], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "Traccia_RAW_Importami.txt";
        a.click();
        alert("File generato! Ora vai su Fiber Trace -> Importa ASCII -> Seleziona questo file.");
    }
</script>
</body>
</html>
